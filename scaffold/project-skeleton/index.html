<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title><PROJECT NAME></title>
<style>
  /* Mobile-first. No third-party CDN — everything inline so a network hiccup
     can never break the core UI (a studio lesson learned the hard way). */
  :root { --bg:#0f1115; --card:#171a21; --ink:#e8eaed; --dim:#9aa3b2; --accent:#7ce38b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:16px; font-weight:700; font-size:18px; }
  main { padding:0 16px 32px; max-width:520px; margin:0 auto; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin:10px 0; }
  .dim { color:var(--dim); font-size:13px; }
  .err { color:#ff8080; }
</style>
</head>
<body>
<header>🌱 <PROJECT NAME></header>
<main id="app"><div class="dim">Loading…</div></main>
<script>
// Load data from JSON (not inlined) — this is the seam a real backend plugs into.
async function boot(){
  const app = document.getElementById('app');
  try {
    const items = await fetch('data/items.json', {cache:'no-cache'}).then(r=>r.json());
    render(app, items);
  } catch (e) {
    // Degrade gracefully: show the failure, never a blank screen.
    app.innerHTML = '<div class="card err">Failed to load data/items.json: '+ (e && e.message) +'</div>';
  }
}
function render(app, items){
  app.innerHTML = (items||[]).map(it =>
    `<div class="card"><b>${it.title||'(untitled)'}</b><div class="dim">${it.subtitle||''}</div></div>`
  ).join('') || '<div class="dim">No items yet — edit data/items.json.</div>';
}
boot();
</script>
</body>
</html>
