name: Weekly land scan

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch: {}    # also run on demand

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scanner
        id: scan
        # Don't let a degraded/aborted scan kill the whole job — we still want
        # to commit any good data and surface the health summary below.
        continue-on-error: true
        run: python scripts/scan.py

      - name: Surface scan health
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("data/scan_health.json")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not p.exists():
              line = "Scan health: no data/scan_health.json written (scanner crashed before emitting one)."
              print(line)
              if summary:
                  open(summary, "a").write("### Weekly scan health\n\n" + line + "\n")
              raise SystemExit(0)
          h = json.loads(p.read_text())
          lines = [
              "### Weekly scan health",
              "",
              f"- Status: **{h.get('status','?')}**",
              f"- Sources attempted: {h.get('attempted','?')}  succeeded: {h.get('succeeded','?')}  empty: {h.get('empty','?')}  failed: {h.get('failed','?')}",
              f"- Total rows: {h.get('total_rows','?')}  new DD candidates: {h.get('new_dd','?')}",
              "",
              "| Source | Status | Rows |",
              "| --- | --- | --- |",
          ]
          for name, s in (h.get("sources") or {}).items():
              lines.append(f"| {name} | {s.get('status','?')} | {s.get('rows',0)} |")
          out = "\n".join(lines) + "\n"
          print(out)
          if summary:
              open(summary, "a").write(out + "\n")
          # Fail the job loudly on a no-data abort; warn (don't fail) on degraded.
          if h.get("status") == "aborted_no_data":
              raise SystemExit("scan aborted: all sources empty/failed")
          if h.get("degraded"):
              print("::warning title=Weekly scan degraded::"
                    f"{h.get('failed',0)} failed / {h.get('empty',0)} empty sources this run")
          PY

      - name: Regulatory watch — re-check tracked items
        env:
          # Optional secrets — set these in repo Settings → Secrets & variables
          # → Actions to escalate past bot walls. Both are optional; chain
          # falls back gracefully if they're unset.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          HTTPS_PROXY_RESI: ${{ secrets.HTTPS_PROXY_RESI }}
        run: python scripts/watch_regulatory.py
        continue-on-error: true   # blocked sites shouldn't fail the build

      - name: Open issues for new high-rated listings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/notify.py

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "weekly scan: refresh data ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "no data changes"
          fi
