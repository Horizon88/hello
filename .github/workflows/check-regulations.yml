name: Check regulations

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC
  workflow_dispatch: {}    # also run on demand

permissions:
  contents: write
  issues: write

concurrency:
  group: regwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check official sources for changes
        run: python regwatch/scripts/check.py

      - name: Open issues for changed regulations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python regwatch/scripts/notify.py

      - name: Commit snapshot updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regwatch/data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "regwatch: refresh snapshots ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "no snapshot changes"
          fi
